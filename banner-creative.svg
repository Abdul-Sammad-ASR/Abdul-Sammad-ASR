<svg width="100%" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#0A0F2C"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Invisible flight paths that the code snippets travel along -->
    <path id="flightPath1" d="M -100,380 C 300,260 700,140 1300,10" fill="none"/>
    <path id="flightPath2" d="M -120,60  C 250,150 650,260 1320,340" fill="none"/>
    <path id="flightPath3" d="M -100,420 C 350,300 800,120 1300,-20" fill="none"/>
    <path id="flightPath4" d="M -120,20  C 300,120 700,220 1320,300" fill="none"/>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Soft twinkling stars -->
  <g fill="#00F5FF" opacity="0.5">
    <circle cx="150" cy="60" r="1.4"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="70" r="1.4"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="300" r="1.3"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="320" r="1.3"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="4.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ===================== CREATIVE ELEMENT: FLYING CODE ===================== -->
  <!-- Each snippet flies diagonally across the banner, fading in and out, on an endless loop -->

  <g font-family="Consolas, 'Courier New', monospace" font-weight="600">
    <text font-size="20" fill="#00F5FF" filter="url(#glow)">
      &lt;/&gt;
      <animateMotion dur="9s" repeatCount="indefinite" rotate="auto">
        <mpath href="#flightPath1"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="9s" repeatCount="indefinite"/>
    </text>

    <text font-size="16" fill="#8A2BE2" filter="url(#glow)">
      import ai
      <animateMotion dur="11s" begin="-3s" repeatCount="indefinite" rotate="auto">
        <mpath href="#flightPath2"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="11s" begin="-3s" repeatCount="indefinite"/>
    </text>

    <text font-size="18" fill="#6C63FF" filter="url(#glow)">
      def train():
      <animateMotion dur="10s" begin="-6s" repeatCount="indefinite" rotate="auto">
        <mpath href="#flightPath3"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="10s" begin="-6s" repeatCount="indefinite"/>
    </text>

    <text font-size="15" fill="#00F5FF" filter="url(#glow)">
      01101
      <animateMotion dur="12s" begin="-1.5s" repeatCount="indefinite" rotate="auto">
        <mpath href="#flightPath4"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="12s" begin="-1.5s" repeatCount="indefinite"/>
    </text>

    <text font-size="17" fill="#8A2BE2" filter="url(#glow)">
      { AI }
      <animateMotion dur="10.5s" begin="-8s" repeatCount="indefinite" rotate="auto">
        <mpath href="#flightPath1"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="10.5s" begin="-8s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- ===================== SIMPLE AI NODE NETWORK ===================== -->
  <g stroke="#00F5FF" stroke-width="1" opacity="0.35" fill="none">
    <line x1="880" y1="200" x2="980" y2="145"/>
    <line x1="880" y1="200" x2="980" y2="255"/>
    <line x1="980" y1="145" x2="1080" y2="200"/>
    <line x1="980" y1="255" x2="1080" y2="200"/>
  </g>
  <g fill="#00F5FF" filter="url(#glow)">
    <circle cx="880" cy="200" r="6">
      <animate attributeName="r" values="5;8;5" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="145" r="5"/>
    <circle cx="980" cy="255" r="5"/>
    <circle cx="1080" cy="200" r="6" fill="#8A2BE2">
      <animate attributeName="r" values="5;8;5" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===================== LEFT BRANDING ===================== -->
  <g font-family="Arial, sans-serif">
    <text x="70" y="170" font-size="54" font-weight="700" fill="#FFFFFF" letter-spacing="2" filter="url(#glow)">
      ABDUL SAMMAD
    </text>

    <text x="72" y="210" font-size="22" fill="#00F5FF">
      Computer Science Undergraduate
    </text>

    <text x="72" y="242" font-size="18" fill="#B8C7E0">
      Aspiring AI &amp; Python Developer
    </text>

    <text x="72" y="285" font-size="15" fill="#8A2BE2" letter-spacing="1">
      AI  •  Python  •  Web Development  •  Cybersecurity
    </text>
  </g>

  <!-- Thin frame -->
  <rect x="2" y="2" width="1196" height="396" fill="none" stroke="#00F5FF" stroke-opacity="0.15"/>

</svg>
