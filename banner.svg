<svg xmlns="http://www.w3.org/2000/svg"
     width="2560"
     height="850"
     viewBox="0 0 2560 850">

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="55%" stop-color="#0a1024"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>

    <linearGradient id="neon">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#6C63FF"/>
      <stop offset="100%" stop-color="#8A2BE2"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid"
             width="70"
             height="70"
             patternUnits="userSpaceOnUse">
      <path d="M70 0H0V70"
            fill="none"
            stroke="#00F5FF"
            stroke-opacity=".055"/>
    </pattern>

  </defs>

  <!-- BACKGROUND -->
  <rect width="2560" height="850" fill="url(#bg)"/>
  <rect width="2560" height="850" fill="url(#grid)"/>

  <!-- SUBTLE GLOW -->
  <circle cx="1950" cy="420" r="330"
          fill="#6C63FF"
          opacity=".035">
    <animate attributeName="r"
             values="300;360;300"
             dur="8s"
             repeatCount="indefinite"/>
  </circle>


  <!-- ================================================= -->
  <!-- FLOATING CUSTOM LANGUAGE SYMBOLS -->
  <!-- ================================================= -->

  <g font-family="JetBrains Mono, monospace"
     font-weight="700"
     text-anchor="middle"
     filter="url(#glow)">

    <!-- PYTHON -->
    <g fill="#00F5FF" opacity=".75">
      <circle cx="1500" cy="120" r="24"
              fill="none"
              stroke="#00F5FF"
              stroke-width="2"/>
      <text x="1500" y="127" font-size="20">Py</text>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0; 45 35; 0 70; -35 35; 0 0"
        dur="8s"
        repeatCount="indefinite"/>
    </g>


    <!-- C++ -->
    <g fill="#6C63FF" opacity=".65">
      <circle cx="1780" cy="180" r="26"
              fill="none"
              stroke="#6C63FF"
              stroke-width="2"/>
      <text x="1780" y="187" font-size="18">C++</text>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;-40 45;10 90;45 40;0 0"
        dur="7s"
        repeatCount="indefinite"/>
    </g>


    <!-- JAVASCRIPT -->
    <g fill="#00F5FF" opacity=".7">
      <rect x="2010" y="110"
            width="55"
            height="55"
            rx="12"
            fill="none"
            stroke="#00F5FF"
            stroke-width="2"/>
      <text x="2037" y="145" font-size="18">JS</text>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;35 55;-15 100;-45 45;0 0"
        dur="9s"
        repeatCount="indefinite"/>
    </g>


    <!-- JAVA -->
    <g fill="#8A2BE2" opacity=".65">
      <polygon points="2180,220 2210,238 2210,274 2180,292 2150,274 2150,238"
               fill="none"
               stroke="#8A2BE2"
               stroke-width="2"/>
      <text x="2180" y="262" font-size="16">Java</text>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;-30 40;20 90;50 40;0 0"
        dur="8s"
        repeatCount="indefinite"/>
    </g>


    <!-- HTML -->
    <g fill="#00F5FF" opacity=".6">
      <text x="1580" y="360" font-size="25">&lt;/&gt;</text>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;60 -25;100 20;40 65;0 0"
        dur="7s"
        repeatCount="indefinite"/>
    </g>


    <!-- CSS -->
    <g fill="#6C63FF" opacity=".7">
      <text x="1900" y="350" font-size="24">{ }</text>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;-50 35;-10 80;45 35;0 0"
        dur="8s"
        repeatCount="indefinite"/>
    </g>


    <!-- REACT -->
    <g fill="#00F5FF" opacity=".65">
      <circle cx="2250" cy="390" r="25"
              fill="none"
              stroke="#00F5FF"
              stroke-width="2"/>
      <text x="2250" y="397" font-size="15">RE</text>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;-40 -40;20 -80;60 -35;0 0"
        dur="9s"
        repeatCount="indefinite"/>
    </g>


    <!-- NODE -->
    <g fill="#8A2BE2" opacity=".6">
      <text x="1650" y="540" font-size="20">NODE</text>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;45 30;80 -10;30 -55;0 0"
        dur="8s"
        repeatCount="indefinite"/>
    </g>


    <!-- GIT -->
    <g fill="#00F5FF" opacity=".7">
      <circle cx="2020" cy="530" r="27"
              fill="none"
              stroke="#00F5FF"
              stroke-width="2"/>
      <text x="2020" y="537" font-size="17">Git</text>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;-55 -30;-20 -75;45 -35;0 0"
        dur="7s"
        repeatCount="indefinite"/>
    </g>


    <!-- LINUX -->
    <g fill="#6C63FF" opacity=".6">
      <text x="2250" y="570" font-size="19">$_</text>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;35 -45;80 -15;40 50;0 0"
        dur="8s"
        repeatCount="indefinite"/>
    </g>


    <!-- SQL -->
    <g fill="#00F5FF" opacity=".6">
      <text x="1750" y="680" font-size="21">SQL</text>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;-40 -35;15 -70;55 -25;0 0"
        dur="9s"
        repeatCount="indefinite"/>
    </g>


    <!-- TYPESCRIPT -->
    <g fill="#8A2BE2" opacity=".6">
      <circle cx="2100" cy="690" r="25"
              fill="none"
              stroke="#8A2BE2"
              stroke-width="2"/>
      <text x="2100" y="697" font-size="14">TS</text>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;50 -35;15 -75;-40 -30;0 0"
        dur="8s"
        repeatCount="indefinite"/>
    </g>


    <!-- DOCKER -->
    <g fill="#00F5FF" opacity=".55">
      <text x="2360" y="700" font-size="18">DOCKER</text>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;-40 -50;-80 -10;-30 40;0 0"
        dur="9s"
        repeatCount="indefinite"/>
    </g>

  </g>


  <!-- ================================================= -->
  <!-- SUBTLE DATA LINES -->
  <!-- ================================================= -->

  <g fill="none"
     stroke="url(#neon)"
     stroke-width="2"
     opacity=".35">

    <path d="M1450 220 H2320"
          stroke-dasharray="12 35">
      <animate attributeName="stroke-dashoffset"
               values="0;-300"
               dur="5s"
               repeatCount="indefinite"/>
    </path>

    <path d="M1450 620 H2350"
          stroke-dasharray="8 45">
      <animate attributeName="stroke-dashoffset"
               values="0;-300"
               dur="6s"
               repeatCount="indefinite"/>
    </path>

  </g>


  <!-- ================================================= -->
  <!-- MAIN NAME -->
  <!-- ================================================= -->

  <g font-family="Space Grotesk, JetBrains Mono, Arial, sans-serif">

    <text x="150"
          y="350"
          font-size="86"
          font-weight="700"
          letter-spacing="5"
          fill="#FFFFFF">
      ABDUL SAMMAD
    </text>

    <line x1="155"
          y1="380"
          x2="650"
          y2="380"
          stroke="url(#neon)"
          stroke-width="3"/>

  </g>


  <!-- ================================================= -->
  <!-- LIVE TITLE -->
  <!-- ================================================= -->

  <g font-family="JetBrains Mono, monospace"
     font-size="31"
     font-weight="700"
     text-anchor="start">

    <text x="155"
          y="440"
          fill="#00F5FF">

      COMPUTER SCIENCE UNDERGRADUATE

      <animate
        attributeName="opacity"
        values="1;1;0;0;1"
        keyTimes="0;.25;.35;.8;1"
        dur="8s"
        repeatCount="indefinite"/>

    </text>


    <text x="155"
          y="440"
          fill="#6C63FF"
          opacity="0">

      AI &amp; PYTHON DEVELOPER

      <animate
        attributeName="opacity"
        values="0;0;1;1;0"
        keyTimes="0;.25;.35;.8;1"
        dur="8s"
        repeatCount="indefinite"/>

    </text>


    <text x="155"
          y="440"
          fill="#00F5FF"
          opacity="0">

      WEB DEVELOPER

      <animate
        attributeName="opacity"
        values="0;0;0;0;1"
        dur="8s"
        repeatCount="indefinite"/>

    </text>

  </g>


  <!-- ================================================= -->
  <!-- SMALL DESCRIPTION -->
  <!-- ================================================= -->

  <text x="155"
        y="500"
        font-family="JetBrains Mono, monospace"
        font-size="20"
        fill="#AAB6CC"
        letter-spacing="2">

    AI • PYTHON • WEB DEVELOPMENT • CYBERSECURITY

  </text>


  <!-- ================================================= -->
  <!-- FLOATING PARTICLES -->
  <!-- ================================================= -->

  <g fill="#00F5FF">

    <circle cx="900" cy="180" r="3">
      <animate attributeName="cy"
               values="180;230;180"
               dur="6s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="1100" cy="650" r="2">
      <animate attributeName="cx"
               values="1100;1160;1100"
               dur="7s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="1320" cy="300" r="2">
      <animate attributeName="cy"
               values="300;250;300"
               dur="5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="2450" cy="180" r="3">
      <animate attributeName="cy"
               values="180;230;180"
               dur="8s"
               repeatCount="indefinite"/>
    </circle>

  </g>


  <!-- BORDER -->
  <rect x="10"
        y="10"
        width="2540"
        height="830"
        rx="25"
        fill="none"
        stroke="#00F5FF"
        stroke-opacity=".12"
        stroke-width="2"/>

</svg>